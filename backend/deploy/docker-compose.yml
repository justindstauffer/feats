version: '3.8'

services:
  api:
    image: feats-api:latest
    container_name: feats-api
    restart: unless-stopped
    env_file:
      - ../.env.production
    volumes:
      # Persist database and uploaded files
      - feats-data:/app/data
      - feats-storage:/app/storage
      # APNs key for push notifications (read-only)
      - /home/feats/secrets/apns.p8:/app/secrets/apns.p8:ro
      # FCM (Android push) service-account key (read-only). Place the file on the
      # host at this path; it is not in git. FCM_CREDENTIALS_PATH in
      # .env.production must point at the in-container path below.
      - /home/feats/secrets/feats-fcm.json:/app/secrets/feats-fcm.json:ro
    environment:
      - DATABASE_PATH=/app/data/feats.db
      - STORAGE_PATH=/app/storage
      - GIN_MODE=release
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  feats-data:
    external: true
  feats-storage:
    external: true
