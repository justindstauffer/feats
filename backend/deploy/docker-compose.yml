version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: feats-api
    restart: unless-stopped
    env_file:
      - ../.env.production
    volumes:
      # Persist database and uploaded files
      - feats-data:/app/data
      - feats-storage:/app/storage
    environment:
      - DATABASE_PATH=/app/data/feats.db
      - STORAGE_PATH=/app/storage
      - GIN_MODE=release
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  feats-data:
    driver: local
  feats-storage:
    driver: local
